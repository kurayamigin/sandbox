name: Sandbox pipeline
on:
  push:
    branches:
      - develop
jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out code
        uses: actions/checkout@v4
      - name: setup java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Check pre-installed Chrome version
        run: google-chrome --version || echo "No Chrome found"

      - name: Install Chrome
        run: |
          sudo apt-get update
          wget https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_135.0.7049.114-1_amd64.deb
          sudo apt-get install -y --allow-downgrades ./google-chrome-stable_135.0.7049.114-1_amd64.deb

      - name: Show Chrome version
        run: google-chrome --version

      - name: Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          wget 	https://storage.googleapis.com/chrome-for-testing-public/135.0.7049.114/linux64/chromedriver-linux64.zip
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Grant permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Selenium Tests
        run: ./gradlew test --stacktrace --info

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: build/reports/tests/test/index.html
